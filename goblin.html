    <script>
        // --- Firebase Configuration ---
        const firebaseConfig = {

            authDomain: "cm-movie-world.firebaseapp.com",
            projectId: "cm-movie-world",
            storageBucket: "cm-movie-world.firebasestorage.app",
            messagingSenderId: "9868705427",
            appId: "1:9868705427:web:80d7b0a78496562bfe9766",
            measurementId: "G-52QRFKZRBY"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();
        const ADMIN_UID = "l7YbcsX71dheETohs1YSnzdRkry2";

        // --- Supabase Configuration ---
        const SUPABASE_URL = "https://vuftwlmdftvyclcjwgld.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_RR8S7DY_I8oUlcCvVntpqg_sahIYtQP";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const dramaKey = urlParams.get('drama') || urlParams.get('id') || 'goblin'; 

        const CHAT_COLLECTION = dramaKey + "_chat";
        const SETTINGS_DOC = dramaKey + "_settings";
        
        let currentEpKey = dramaKey + "_ep1"; 
        const maxViewsPerDay = 5; 

        function formatViewsOrLikes(num) {
            if (num >= 1000000000) return (num / 1000000000).toFixed(1).replace(/\.0$/, '') + 'B';
            if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
            return num;
        }

        // --- Supabase Views & Likes Loader (Persistent) ---
        async function initViewsAndLikesForEpisode(epKey) {
            const viewCountSpan = document.getElementById('view-count');
            const likeCountSpan = document.getElementById('like-count');
            const likeBtn = document.getElementById('like-btn');
            
            const statId = `${dramaKey}_${epKey}`;
            if(likeBtn) likeBtn.classList.remove('liked');
            if(viewCountSpan) viewCountSpan.innerText = "...";
            if(likeCountSpan) likeCountSpan.innerText = "...";

            try {
                let { data, error } = await supabaseClient.from('drama_stats').select('*').eq('id', statId).maybeSingle();

                if (data) {
                    viewCountSpan.innerText = formatViewsOrLikes(data.views || 0);
                    likeCountSpan.innerText = formatViewsOrLikes(data.likes || 0);
                } else {
                    viewCountSpan.innerText = '0';
                    likeCountSpan.innerText = '0';
                    await supabaseClient.from('drama_stats').insert([{ id: statId, views: 0, likes: 0 }]);
                }

                const user = auth.currentUser;
                if (user && likeBtn) {
                    let { data: likeData } = await supabaseClient.from('user_likes').select('*').eq('id', `${user.uid}_${statId}`).maybeSingle();
                    if (likeData) {
                        likeBtn.classList.add('liked');
                    }
                }
            } catch (e) {
                console.error("Supabase Init Error:", e);
                if(viewCountSpan) viewCountSpan.innerText = '0';
                if(likeCountSpan) likeCountSpan.innerText = '0';
            }
        }

        // --- Supabase Like & Unlike System ---
        async function handleLikeClick() {
            const user = auth.currentUser;
            if (!user) {
                openLoginModal();
                return;
            }

            const statId = `${dramaKey}_${currentEpKey}`;
            const likeBtn = document.getElementById('like-btn');
            const likeCountSpan = document.getElementById('like-count');
            const userLikeId = `${user.uid}_${statId}`;

            let isLiked = likeBtn.classList.contains('liked');

            try {
                let { data } = await supabaseClient.from('drama_stats').select('*').eq('id', statId).maybeSingle();
                let currentLikes = data ? (data.likes || 0) : 0;
                let currentViews = data ? (data.views || 0) : 0;

                if (isLiked) {
                    let newLikes = Math.max(0, currentLikes - 1);
                    likeBtn.classList.remove('liked');
                    likeCountSpan.innerText = formatViewsOrLikes(newLikes);

                    await supabaseClient.from('drama_stats').update({ likes: newLikes }).eq('id', statId);
                    await supabaseClient.from('user_likes').delete().eq('id', userLikeId);
                } else {
                    let newLikes = currentLikes + 1;
                    likeBtn.classList.add('liked');
                    likeCountSpan.innerText = formatViewsOrLikes(newLikes);

                    await supabaseClient.from('drama_stats').update({ likes: newLikes }).eq('id', statId);
                    await supabaseClient.from('user_likes').insert([{ id: userLikeId, user_id: user.uid, ep_key: statId }]);
                }
            } catch (err) {
                console.error('Like error:', err);
                alert("Like කිරීමේදී දෝෂයක් ඇති විය. කරුණාකර නැවත උත්සාහ කරන්න.");
            }
        }

        function loadDramaDetails() {
            db.collection("dramas").doc(dramaKey).get().then((doc) => {
                if (doc.exists) {
                    let drama = doc.data();
                    document.title = drama.title + " - C-MO Streaming";
                    document.getElementById('dramaTitleText').innerText = drama.title;
                    document.getElementById('dramaDescText').innerText = drama.description;
                    document.getElementById('dramaPosterImg').src = drama.poster;
                    
                    document.getElementById('bannerSection').style.background = `linear-gradient(to top, #0f0f0f 5%, rgba(15,15,15,0.6) 50%, rgba(15,15,15,0.9)), url('${drama.poster}')`;
                    document.getElementById('bannerSection').style.backgroundSize = "cover";
                    document.getElementById('bannerSection').style.backgroundPosition = "center";

                    const metaContainer = document.getElementById('dramaMetaTags');
                    metaContainer.innerHTML = `
                        <span>${drama.year || '2026'}</span>
                        <span>${drama.episodesCount || '16 Episodes'}</span>
                        <span>${drama.genres}</span>
                        <span>${drama.rating}</span>
                    `;
                } else {
                    document.getElementById('dramaTitleText').innerText = "Drama Not Found";
                    document.getElementById('dramaDescText').innerText = "මෙම ඩ්‍රාමා එක ඩේටාබේස් එකේ හමු නොවීය.";
                }
            });

            db.collection("dramas").doc(dramaKey).collection("episodes").orderBy("episodeNumber").get().then((querySnapshot) => {
                const gridContainer = document.getElementById('episodesGridContainer');
                gridContainer.innerHTML = "";

                if (querySnapshot.empty) {
                    gridContainer.innerHTML = "<p style='color: #888;'>No episodes added yet. Please add via Admin Panel.</p>";
                    document.getElementById('epTitleDisplay').innerText = "Now Playing: Coming Soon";
                    return;
                }

                let firstVideoUrl = "";
                let firstEpName = "";
                let firstEpNum = 1;

                querySnapshot.forEach((epDoc) => {
                    let ep = epDoc.data();
                    let epNum = ep.episodeNumber;
                    let videoUrl = ep.videoUrl;
                    let epTitle = "Episode " + epNum;

                    let card = document.createElement('div');
                    card.className = 'episode-card';
                    
                    let clickAction = "";
                    let statusBadge = "";

                    if (videoUrl && videoUrl.trim() !== "") {
                        clickAction = `changeEpisode('${videoUrl}', '${epTitle}', ${epNum})`;
                        statusBadge = `<p style="color: #28a745; font-weight: 600;">Complete 🎬</p>`;
                        
                        if (!firstVideoUrl) {
                            firstVideoUrl = videoUrl;
                            firstEpName = epTitle;
                            firstEpNum = epNum;
                        }
                    } else {
                        clickAction = `changeEpisode('COMING_SOON', '${epTitle}', ${epNum})`;
                        statusBadge = `<p style="color: #ff9900; font-weight: 600;">Coming Soon ⏳</p>`;
                    }

                    card.setAttribute('onclick', clickAction);
                    card.innerHTML = `
                        <div class="ep-thumb">
                            <img class="ep-card-img" src="" alt="${epTitle}" style="width:100%; height:100%; object-fit:cover;">
                            <div class="play-overlay"><i class="fa-solid fa-play"></i></div>
                        </div>
                        <div class="ep-info">
                            <h4>${epTitle}</h4>
                            ${statusBadge}
                        </div>
                    `;
                    gridContainer.appendChild(card);
                });

                db.collection("dramas").doc(dramaKey).get().then((doc) => {
                    if(doc.exists) {
                        let posterUrl = doc.data().poster;
                        document.querySelectorAll('.ep-card-img').forEach(img => img.src = posterUrl);
                    }
                });

                if (firstVideoUrl) {
                    currentEpKey = `${dramaKey}_ep${firstEpNum}`;
                    initViewsAndLikesForEpisode(currentEpKey);
                    document.getElementById('moviePlayer').src = firstVideoUrl;
                    document.getElementById('epTitleDisplay').innerText = "Now Playing: " + firstEpName;
                } else {
                    document.getElementById('epTitleDisplay').innerText = "Now Playing: Coming Soon";
                }
            });
        }

        let isSignUpMode = false;
        let replyingToData = null;
        let editingDocId = null;

        function openLoginModal() { document.getElementById('loginModalBox').style.display = "flex"; }
        function closeLoginModal() { document.getElementById('loginModalBox').style.display = "none"; }
        window.onclick = function(event) { if (event.target == document.getElementById('loginModalBox')) closeLoginModal(); }

        function toggleAuthMode(event) {
            event.preventDefault();
            isSignUpMode = !isSignUpMode;
            let modalTitle = document.getElementById('modalTitle');
            let authSubmitBtn = document.getElementById('authSubmitBtn');
            let switchText = document.getElementById('switchText');
            let switchLink = document.getElementById('switchLink');

            if (isSignUpMode) {
                modalTitle.innerText = "Create Account";
                authSubmitBtn.innerText = "Sign Up";
                switchText.innerText = "Already have an account?";
                switchLink.innerText = "Sign In";
            } else {
                modalTitle.innerText = "Sign In";
                authSubmitBtn.innerText = "Login";
                switchText.innerText = "Don't have an account?";
                switchLink.innerText = "Sign Up";
            }
        }

        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                let user = result.user;
                db.collection("users").doc(user.uid).set({
                    name: user.displayName, email: user.email, photo: user.photoURL,
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                alert("Welcome, " + user.displayName + "!");
                closeLoginModal();
                initViewsAndLikesForEpisode(currentEpKey);
            }).catch((error) => alert("Google Login failed: " + error.message));
        }

        function handleEmailAuth(event) {
            event.preventDefault();
            let email = document.getElementById('loginEmail').value.trim();
            let password = document.getElementById('loginPassword').value;

            if (isSignUpMode) {
                auth.createUserWithEmailAndPassword(email, password).then((userCredential) => {
                    let user = userCredential.user;
                    db.collection("users").doc(user.uid).set({
                        name: email.split('@')[0], email: email,
                        photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80",
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert("Account created successfully!");
                    closeLoginModal();
                    initViewsAndLikesForEpisode(currentEpKey);
                }).catch((error) => alert("Sign Up Failed: " + error.message));
            } else {
                auth.signInWithEmailAndPassword(email, password).then(() => {
                    alert("Login Successful!");
                    closeLoginModal();
                    initViewsAndLikesForEpisode(currentEpKey);
                }).catch((error) => alert("Login Failed: " + error.message));
            }
        }

        function changeEpisode(videoUrl, epName, epNumber) {
            const user = auth.currentUser;
            if (!user) { openLoginModal(); return; }

            if (videoUrl === 'COMING_SOON' || !videoUrl) {
                alert("Episode not uploaded yet, coming soon!");
                return;
            }

            currentEpKey = `${dramaKey}_ep${epNumber}`;
            initViewsAndLikesForEpisode(currentEpKey);

            const player = document.getElementById('moviePlayer');
            player.src = videoUrl;
            player.load();
            player.play();
            document.getElementById('epTitleDisplay').innerText = "Now Playing: " + epName;
            document.getElementById('playerBox').scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById('moviePlayer').addEventListener('play', function(e) {
            const user = auth.currentUser;
            if (!user) { e.preventDefault(); this.pause(); openLoginModal(); }
        });

        function toggleFullscreen() {
            const playerBox = document.getElementById('playerBox');
            if (document.fullscreenElement) document.exitFullscreen();
            else playerBox.requestFullscreen().catch(err => alert(`Fullscreen Error: ${err.message}`));
        }

        function toggleEmojiPicker() {
            let picker = document.getElementById('emojiPickerPanel');
            picker.style.display = (picker.style.display === 'flex') ? 'none' : 'flex';
        }

        function insertEmoji(emoji) {
            let inputField = document.getElementById('chatInputText');
            inputField.value += emoji;
            inputField.focus();
            document.getElementById('emojiPickerPanel').style.display = 'none';
        }

        function setReplyTo(username, message) {
            editingDocId = null;
            replyingToData = { name: username, text: message };
            let banner = document.getElementById('activeBanner');
            document.getElementById('bannerText').innerText = `Replying to ${username}: "${message.substring(0, 30)}..."`;
            banner.style.display = "flex";
            document.getElementById('chatSubmitBtn').innerText = "Send";
            document.getElementById('chatInputText').value = "";
            document.getElementById('chatInputText').focus();
        }

        function setEditMessage(docId, currentText) {
            replyingToData = null;
            editingDocId = docId;
            let banner = document.getElementById('activeBanner');
            document.getElementById('bannerText').innerText = `Editing message: "${currentText.substring(0, 30)}..."`;
            banner.style.display = "flex";
            document.getElementById('chatSubmitBtn').innerText = "Update";
            let inputField = document.getElementById('chatInputText');
            inputField.value = currentText;
            inputField.focus();
        }

        function cancelActiveAction() {
            replyingToData = null;
            editingDocId = null;
            document.getElementById('activeBanner').style.display = "none";
            document.getElementById('chatSubmitBtn').innerText = "Send";
            document.getElementById('chatInputText').value = "";
        }

        function handleChatSubmit(event) {
            event.preventDefault();
            const user = auth.currentUser;
            if (!user) { openLoginModal(); return; }

            let inputField = document.getElementById('chatInputText');
            let messageText = inputField.value.trim();
            if (messageText === "") return;

            if (editingDocId) {
                db.collection(CHAT_COLLECTION).doc(editingDocId).update({
                    message: messageText, edited: true
                }).then(() => { inputField.value = ""; cancelActiveAction(); });
                return;
            }

            let chatData = {
                uid: user.uid,
                name: user.displayName || user.email.split('@')[0],
                photo: user.photoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80",
                message: messageText,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (replyingToData) {
                chatData.replyToName = replyingToData.name;
                chatData.replyToText = replyingToData.text;
            }

            db.collection(CHAT_COLLECTION).add(chatData).then(() => {
                inputField.value = "";
                cancelActiveAction();
            });
        }

        function deleteMessage(docId) {
            if (confirm("ඔබට මෙම මැසේජ් එක මැකීමට අවශ්‍ය බව විශ්වාසද?")) {
                db.collection(CHAT_COLLECTION).doc(docId).delete();
            }
        }

        function pinMessage(docId, messageText, senderName) {
            db.collection("settings").doc(SETTINGS_DOC).set({
                pinnedId: docId, pinnedText: messageText, pinnedBy: senderName
            }, { merge: true });
        }

        db.collection("settings").doc(SETTINGS_DOC).onSnapshot((doc) => {
            let banner = document.getElementById('pinnedMessageBanner');
            if (doc.exists && doc.data().pinnedText) {
                let data = doc.data();
                document.getElementById('pinnedTextDisplay').innerText = `${data.pinnedBy}: ${data.pinnedText}`;
                banner.style.display = "flex";
            } else {
                banner.style.display = "none";
            }
        });

        function timeAgo(timestamp) {
            if (!timestamp) return "just now";
            let seconds = Math.floor((new Date() - timestamp.toDate()) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " years ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " months ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " days ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " hours ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " minutes ago";
            return "just now";
        }

        function loadChatMessages() {
            const container = document.getElementById('chatMessagesContainer');
            db.collection(CHAT_COLLECTION).orderBy("timestamp", "desc").limit(50).onSnapshot((snapshot) => {
                let messages = [];
                snapshot.forEach((doc) => {
                    let data = doc.data();
                    data.id = doc.id;
                    messages.push(data);
                });
                messages.reverse();

                container.innerHTML = "";
                const currentUser = auth.currentUser;

                messages.forEach((data) => {
                    let msgElement = document.createElement('div');
                    msgElement.className = 'chat-message';
                    
                    let replyHtml = data.replyToName ? `<div class="chat-reply-quote"><strong>${escapeHtml(data.replyToName)}:</strong> ${escapeHtml(data.replyToText)}</div>` : "";
                    let ownerActionsHtml = "";
                    
                    if (currentUser && currentUser.uid === data.uid) {
                        let safeText = data.message.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        ownerActionsHtml += `<button class="action-btn" onclick="setEditMessage('${data.id}', '${safeText}')">Edit</button><button class="action-btn delete-btn" onclick="deleteMessage('${data.id}')">Delete</button>`;
                    } else if (currentUser && currentUser.uid === ADMIN_UID) {
                        ownerActionsHtml += `<button class="action-btn delete-btn" onclick="deleteMessage('${data.id}')">Delete</button>`;
                    }

                    let pinActionHtml = (currentUser && currentUser.uid === ADMIN_UID) ? `<button class="action-btn pin-btn" onclick="pinMessage('${data.id}', '${escapeHtml(data.message).replace(/'/g, "\\'")}', '${escapeHtml(data.name).replace(/'/g, "\\'")}')">Pin</button>` : "";
                    let editedLabel = data.edited ? ' <span style="font-size:10px; color:#777;">(edited)</span>' : '';

                    msgElement.innerHTML = `
                        <img src="${data.photo}" alt="User" class="chat-user-img">
                        <div class="chat-content-bubble">
                            <div style="display: flex; align-items: baseline; gap: 8px;">
                                <span class="chat-username">${escapeHtml(data.name)}</span>
                                <span style="font-size: 11px; color: #777;">${timeAgo(data.timestamp)}</span>
                            </div>
                            ${replyHtml}
                            <span class="chat-text">${escapeHtml(data.message)}${editedLabel}</span>
                            <div class="chat-actions">
                                <button class="action-btn" onclick="setReplyTo('${escapeHtml(data.name).replace(/'/g, "\\'")}', '${escapeHtml(data.message).replace(/'/g, "\\'")}')">Reply</button>
                                ${pinActionHtml}
                                ${ownerActionsHtml}
                            </div>
                        </div>
                    `;
                    container.appendChild(msgElement);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function escapeHtml(text) {
            let map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // --- YouTube Style View Logic with Supabase ---
        let timerStarted = false;
        const todayDate = new Date().toISOString().split('T')[0];

        const moviePlayerElement = document.getElementById('moviePlayer');
        if (moviePlayerElement) {
            moviePlayerElement.addEventListener('timeupdate', async () => {
                const storageKey = `${currentEpKey}_views_${todayDate}`;
                let currentDayViews = parseInt(localStorage.getItem(storageKey)) || 0;

                if (currentDayViews >= maxViewsPerDay || timerStarted) return;

                if (moviePlayerElement.currentTime >= 60) {
                    timerStarted = true;
                    currentDayViews++;
                    localStorage.setItem(storageKey, currentDayViews);

                    const statId = `${dramaKey}_${currentEpKey}`;
                    try {
                        let { data } = await supabaseClient.from('drama_stats').select('*').eq('id', statId).maybeSingle();
                        let currentViews = data ? (data.views || 0) : 0;
                        let currentLikes = data ? (data.likes || 0) : 0;
                        let newViews = currentViews + 1;

                        const viewCountSpan = document.getElementById('view-count');
                        if(viewCountSpan) viewCountSpan.innerText = formatViewsOrLikes(newViews);

                        await supabaseClient.from('drama_stats').update({ views: newViews }).eq('id', statId);
                    } catch (err) {
                        console.error('View update error:', err);
                    }
                }
            });

            moviePlayerElement.addEventListener('play', () => {
                timerStarted = false;
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadDramaDetails(); 
            loadChatMessages(); 
        });
    </script>
</body>
</html>
