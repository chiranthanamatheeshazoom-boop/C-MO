<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dramas | C-MO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App, Auth, and Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .movie-card {
            background: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
            width: 100%;
        }
        .movie-card:hover {
            transform: translateY(-5px);
        }
        .card-img {
            position: relative;
            height: 280px;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #E50914;
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            font-weight: bold;
        }
        .card-info {
            padding: 15px;
            color: white;
        }
        .card-info h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-info p {
            margin: 0;
            color: #aaa;
            font-size: 12px;
        }
        /* Link එකේ යටින් ඉරි වැටෙන එක සහ පාට වෙනස්වීම ඉවත් කිරීමට */
        .movie-grid a {
            text-decoration: none;
            color: inherit;
            display: block;
            width: 100%;
        }
        .movie-grid a:hover {
            color: inherit;
        }

        /* Logo Styling */
        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
            text-decoration: none;
            white-space: nowrap;
        }
        .logo .red-dash, .logo .red-o {
            color: #e50914;
        }

        /* --- Mobile Responsive Adjustments --- */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px !important;
                flex-direction: column;
                align-items: stretch !important;
                gap: 15px;
            }
            nav {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
            }
            nav a {
                margin: 0 10px !important;
            }
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            .card-img {
                height: 210px;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body style="background-color: #141414; font-family: Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; margin: 0; color: #fff;">

    <!-- Navigation Bar -->
    <header style="padding: 20px 50px; background: #000; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;">
        <a href="index.html" class="logo">C<span class="red-dash">-</span>M<span class="red-o">O</span></a>
        <nav>
            <a href="index.html" style="color: white; text-decoration: none; margin-right: 20px; font-weight: 600;">Home</a>
            <a href="dramas.html" style="color: #E50914; text-decoration: none; margin-right: 20px; font-weight: bold;">Dramas</a>
            <a href="#" style="color: white; text-decoration: none; margin-right: 20px; font-weight: 600;">Movies</a>
            <a href="#" style="color: white; text-decoration: none; font-weight: 600;">Genres</a>
        </nav>
    </header>

    <!-- Dramas Section (Auto Generated via Firebase Firestore) -->
    <main class="container">
        <h2 style="color: white; border-left: 4px solid #E50914; padding-left: 10px; font-size: 22px;">All Dramas</h2>
        
        <div class="movie-grid" id="kdramasGridContainer">
            <!-- Firebase එකෙන් දත්ත ස්වයංක්‍රීයව මෙතනට ලෝඩ් වේ -->
        </div>
    </main>

    <!-- Footer -->
    <footer style="text-align: center; padding: 20px; color: #777; margin-top: auto; background: #101010; border-top: 1px solid #222; font-size: 14px;">
        <p>© 2026 C-MO. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript to Load All Dramas Automatically from Firebase -->
    <script>
        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyCIz8pDc6Dy18rNnHamAlJHV5O6UTQFetI",
            authDomain: "cm-movie-world.firebaseapp.com",
            projectId: "cm-movie-world",
            storageBucket: "cm-movie-world.firebasestorage.app",
            messagingSenderId: "9868705427",
            appId: "1:9868705427:web:80d7b0a78496562bfe9766",
            measurementId: "G-52QRFKZRBY"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();

        window.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('kdramasGridContainer');
            if (grid) {
                grid.innerHTML = "<p style='color: #888;'>Loading dramas...</p>";

                db.collection("dramas").get().then((querySnapshot) => {
                    grid.innerHTML = "";

                    if (querySnapshot.empty) {
                        grid.innerHTML = "<p style='color: #888;'>No dramas added yet.</p>";
                        return;
                    }

                    querySnapshot.forEach((doc) => {
                        let drama = doc.data();
                        let dramaKey = doc.id; // උදා: goblin, vincenzo

                        let cardLink = document.createElement('a');
                        cardLink.href = `goblin.html?drama=${dramaKey}`;
                        cardLink.className = 'movie-card-link';

                        cardLink.innerHTML = `
                            <div class="movie-card">
                                <div class="card-img">
                                    <img src="${drama.poster}" alt="${drama.title}">
                                    <span class="badge">POPULAR</span>
                                </div>
                                <div class="card-info">
                                    <h3>${drama.title}</h3>
                                    <p>${drama.genres} • ${drama.episodesCount}</p>
                                </div>
                            </div>
                        `;
                        grid.appendChild(cardLink);
                    });
                }).catch((error) => {
                    console.error("Error loading dramas: ", error);
                    grid.innerHTML = "<p style='color: #ff4444;'>Failed to load dramas.</p>";
                });
            }
        });
    </script>

</body>
</html>
