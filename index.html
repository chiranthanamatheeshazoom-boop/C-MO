<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM Movie World - K-Drama & Movies</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App, Auth, and Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header>
        <div class="logo">CM <span>Movie World</span></div>
        <nav>
			<a href="index.html" class="active">Home</a>
			<a href="kdramas.html">K-Dramas</a>
			<a href="#">Movies</a>
			<a href="#">Genres</a>
        </nav>
        
        <!-- Right side container with Search & Login Button -->
        <div class="nav-right-section">
            <!-- YouTube style Search Container -->
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search dramas..." onkeyup="searchMovies()">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <!-- Dropdown results box -->
                <div id="searchDropdown" class="search-results-dropdown"></div>
            </div>

            <!-- Login / User Profile Container -->
            <div id="authContainer">
                <button id="navLoginBtn" class="login-nav-btn" onclick="openLoginModal()">Sign In</button>
            </div>
        </div>
    </header>

    <!-- Hero / Banner Section -->
    <section class="hero" style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1400&q=80'); background-size: cover; background-position: center;">
        <div class="hero-content">
            <h1>Unlimited K-Dramas & Movies</h1>
            <p>Watch your favorite Korean dramas and movies in high quality, completely free.</p>
            <button class="btn-watch"><i class="fa-solid fa-play"></i> Watch Now</button>
        </div>
    </section>

    <!-- Content Section (Trending Dramas) -->
    <main class="container">
        <h2>Trending K-Dramas</h2>
        
        <div class="movie-grid" id="movieGrid">
            
            <!-- Movie Card 1 (Goblin) -->
            <a href="goblin.html" class="movie-card-link" data-title="goblin" data-url="goblin.html" data-img="goblin 1.jpg" data-desc="Fantasy, Romance • 16 Episodes">
                <div class="movie-card">
                    <div class="card-img">
                        <img src="goblin 1.jpg" alt="Goblin">
                        <span class="badge">POPULAR</span>
                    </div>
                    <div class="card-info">
                        <h3>Goblin</h3>
                        <p>Fantasy, Romance • 16 Episodes</p>
                    </div>
                </div>
            </a>

        </div>
    </main>

    <!-- Login Modal Box (Hidden by default) -->
    <div id="loginModalBox" class="login-modal">
        <div class="login-modal-content">
            <span class="login-close-btn">&times;</span>
            <h2>Sign In</h2>
            
            <!-- Real Google Sign-In Button -->
            <button type="button" class="google-login-btn" onclick="signInWithGoogle()">
                <i class="fa-brands fa-google"></i> Continue with Google
            </button>

            <div class="divider"><span>OR</span></div>

            <!-- Ordinary Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="login-input-group">
                    <label>Email or Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username" required>
                </div>
                <div class="login-input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-submit-btn">Login</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 CM Movie World. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript for Firebase, Firestore, Search, and Login -->
    <script>
        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyCIz8pDc6Dy18rNnHamAlJHV5O6UTQFetI",
            authDomain: "cm-movie-world.firebaseapp.com",
            projectId: "cm-movie-world",
            storageBucket: "cm-movie-world.firebasestorage.app",
            messagingSenderId: "9868705427",
            appId: "1:9868705427:web:80d7b0a78496562bfe9766",
            measurementId: "G-52QRFKZRBY"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Initialize Firestore Database
        const db = firebase.firestore();

        // Check if user is already logged in on page load
        window.onload = function() {
            let loggedUser = localStorage.getItem("cm_username");
            let userPhoto = localStorage.getItem("cm_userphoto");

            if (loggedUser && userPhoto) {
                let authContainer = document.getElementById("authContainer");
                authContainer.innerHTML = `
                    <div class="user-profile-display" onclick="handleLogout()" title="Click to Logout">
                        <img src="${userPhoto}" alt="Profile">
                        <span>${loggedUser}</span>
                    </div>
                `;
            }
        }

        // Open Modal when clicking Sign In button
        function openLoginModal() {
            document.getElementById('loginModalBox').style.display = "block";
        }

        // Close Modal when clicking 'X'
        document.querySelector('.login-close-btn').onclick = function() {
            document.getElementById('loginModalBox').style.display = "none";
        }

        // Close Modal when clicking outside the box
        window.onclick = function(event) {
            let modal = document.getElementById('loginModalBox');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // --- Real Google Sign-In & Save to Firestore Database ---
        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            
            firebase.auth().signInWithPopup(provider)
            .then((result) => {
                let user = result.user;
                let userName = user.displayName;   
                let userPhoto = user.photoURL;     
                let userEmail = user.email;

                // Save user details to Firebase Firestore Database ('users' collection)
                db.collection("users").doc(user.uid).set({
                    name: userName,
                    email: userEmail,
                    photo: userPhoto,
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                })
                .then(() => {
                    console.log("User data successfully saved to Firestore!");
                })
                .catch((error) => {
                    console.error("Error writing user to database: ", error);
                });
                
                // Save to LocalStorage for quick UI display
                localStorage.setItem("cm_username", userName);
                localStorage.setItem("cm_userphoto", userPhoto);

                alert("Welcome, " + userName + "!");
                document.getElementById('loginModalBox').style.display = "none";
                location.reload();
            })
            .catch((error) => {
                console.error("Google Login Error: ", error.message);
                alert("Google Login failed: " + error.message);
            });
        }

        // Simple manual login action handler
        function handleLogin(event) {
            event.preventDefault();
            let username = document.getElementById('loginUsername').value.trim();
            if(username !== "") {
                let defaultPhoto = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80";
                
                localStorage.setItem("cm_username", username);
                localStorage.setItem("cm_userphoto", defaultPhoto);

                alert("Welcome back, " + username + "!");
                document.getElementById('loginModalBox').style.display = "none";
                location.reload();
            }
        }

        // Logout function
        function handleLogout() {
            if(confirm("Do you want to log out?")) {
                firebase.auth().signOut().then(() => {
                    localStorage.removeItem("cm_username");
                    localStorage.removeItem("cm_userphoto");
                    location.reload();
                }).catch(() => {
                    localStorage.removeItem("cm_username");
                    localStorage.removeItem("cm_userphoto");
                    location.reload();
                });
            }
        }

        // --- YouTube Style Live Search Script ---
        function searchMovies() {
            let input = document.getElementById('searchInput').value.toLowerCase().trim();
            let dropdown = document.getElementById('searchDropdown');
            let grid = document.getElementById('movieGrid');
            let cards = grid.getElementsByClassName('movie-card-link');

            dropdown.innerHTML = "";

            if (input === "") {
                dropdown.style.display = "none";
                for (let i = 0; i < cards.length; i++) {
                    cards[i].style.display = "";
                }
                return;
            }

            let matchCount = 0;

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title').toLowerCase();
                let url = cards[i].getAttribute('data-url');
                let img = cards[i].getAttribute('data-img');
                let desc = cards[i].getAttribute('data-desc');
                let cardName = cards[i].querySelector('h3').innerText;

                if (title.includes(input)) {
                    cards[i].style.display = "";
                    matchCount++;

                    let item = document.createElement('a');
                    item.href = url;
                    item.className = 'search-result-item';
                    item.innerHTML = `
                        <img src="${img}" alt="${cardName}">
                        <div class="search-result-info">
                            <h4>${cardName}</h4>
                            <p>${desc}</p>
                        </div>
                    `;
                    dropdown.appendChild(item);
                } else {
                    cards[i].style.display = "none";
                }
            }

            if (matchCount > 0) {
                dropdown.style.display = "block";
            } else {
                dropdown.style.display = "none";
            }
        }

        document.addEventListener('click', function(e) {
            let searchBox = document.querySelector('.search-container');
            if (!searchBox.contains(e.target)) {
                document.getElementById('searchDropdown').style.display = 'none';
            }
        });
    </script>

</body>
</html>
